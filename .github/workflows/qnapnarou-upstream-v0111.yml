name: QnapNarou v0.1.11 reviewed upstream v0.5.3 (one-shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/qnapnarou-upstream-v0111.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qnapnarou-release-v0111
  cancel-in-progress: false

jobs:
  native-qpkg-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source/tag/version and refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: souten-yd/QnapNarou
        run: |
          set -eu
          test "$(git rev-parse HEAD:upstream/narou.rs)" = "4c0c15849690b12ee27faf617eabbb863b73d72a"
          test "$(git -C upstream/narou.rs rev-parse HEAD)" = "4c0c15849690b12ee27faf617eabbb863b73d72a"
          test "$(git -C upstream/narou.rs rev-parse 'refs/tags/v0.5.3^{commit}')" = "4c0c15849690b12ee27faf617eabbb863b73d72a"
          grep -qx 'QPKG_VER="0.1.11"' qdk/qpkg.cfg
          grep -qx 'QPKG_LICENSE="GPL-3.0-only"' qdk/qpkg.cfg
          if gh release view v0.1.11 >/dev/null 2>&1; then
            echo 'v0.1.11 already published; refusing overwrite' >&2
            exit 1
          fi
      - name: Python, iPhone JavaScript, QNAP service guards
        run: |
          set -eu
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q tools tests
          node --check tools/qnap_epub_download.js
          node tests/test_qnap_epub_browser.cjs
          sh -n qdk/shared/QnapNarou.sh
          sh -n qdk/shared/ensure_ws.sh
          grep -q 'NAROU_RS_DISABLE_SELF_UPDATE=1' qdk/shared/QnapNarou.sh
          grep -q 'PYTHONDONTWRITEBYTECODE=1' qdk/shared/QnapNarou.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/narou.rs
      - name: Install Rust and QDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools pkg-config build-essential cmake perl
      - name: Build complete upstream native runtime and helpers
        working-directory: upstream/narou.rs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo local-build --locked --target x86_64-unknown-linux-musl
      - name: Apply reviewed GPL EPUB/iPhone and Home Screen source overlays
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -eu
          python3 tools/build_epub_lite.py --source upstream/narou.rs --runtime upstream/narou.rs/narou --target x86_64-unknown-linux-musl
          grep -F -q 'QnapNarou EPUB save/share overlay.' upstream/narou.rs/src/web/assets/js/ui/render.js
          grep -F -q 'data-qnap-epub="1"' upstream/narou.rs/src/web/assets/js/ui/render.js
          grep -F -q 'apple-touch-icon' upstream/narou.rs/src/web/assets/index.html
          grep -a -F -q 'QnapNarou EPUB save/share overlay.' upstream/narou.rs/narou/narou_rs
          grep -a -F -q 'qnapnarou-icon.png' upstream/narou.rs/narou/narou_rs
          test -s upstream/narou.rs/narou/AozoraEpub3-Lite-License.md
          if readelf -l upstream/narou.rs/narou/narou_rs | grep -q INTERP; then
            echo 'QNAP runtime must be statically linked' >&2
            exit 1
          fi
      - name: Native EPUB regression test
        working-directory: upstream/narou.rs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo test --locked --target x86_64-unknown-linux-musl --features lite --lib epub_lite::tests::builds_streamable_epub_from_a_text_file -- --exact
      - name: Inspect and package complete QDK runtime
        run: |
          set -eu
          python3 tools/stage_release.py --source upstream/narou.rs/narou --dest build/runtime
          python3 tools/build_qdk.py --runtime build/runtime --out build/qdk
          grep -qx 'QPKG_VER="0.1.11"' build/qdk/qpkg.cfg
          test -x build/qdk/x86_64/runtime/narou_rs
          test -s build/qdk/x86_64/runtime/Third-Party-License.md
          test -s build/qdk/x86_64/runtime/AozoraEpub3-Lite-License.md
          test -s build/qdk/shared/installer.py
          curl -fL --retry 3 -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          (cd build/qdk && qbuild)
          mkdir -p dist
          test "$(find build/qdk -name '*.qpkg' -type f | wc -l)" -eq 1
          find build/qdk -name '*.qpkg' -type f -exec cp '{}' dist/QnapNarou_x86_64_0.1.11.qpkg \;
          test -s dist/QnapNarou_x86_64_0.1.11.qpkg
          sha256sum dist/QnapNarou_x86_64_0.1.11.qpkg | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: QnapNarou-x86_64-0.1.11-reviewed-v0.5.3
          path: |
            dist/QnapNarou_x86_64_0.1.11.qpkg
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Publish exact tested QPKG (no replacement)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: souten-yd/QnapNarou
        run: |
          set -eu
          (cd dist && sha256sum -c SHA256SUMS)
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          # QnapNarou v0.1.11 — narou.rs v0.5.3

          - Native x86_64 GPL lite runtime from upstream v0.5.3 commit 4c0c15849690b12ee27faf617eabbb863b73d72a, with reviewed QNAP iPhone EPUB modal, Home Screen icons, QTS manager and boot retry.
          - On-demand Web updater only; no background source polling, automatic NAS installation or SQLite RAM-durability changes.
          - SHA256SUMS contains the final QPKG checksum. Exact source is this tag's QNAP code + public pinned upstream gitlink.
          - All CI tests, native Rust compile and QDK packaging must pass before this release is created.
          - Real QTS install, post-upgrade Web UI, rollback and idle IOPS have not yet been verified for v0.1.11. Back up QnapNarou-data before upgrading. Keep ports 8888/8889 on LAN/Tailscale only.
          NOTES
          gh release create v0.1.11 dist/QnapNarou_x86_64_0.1.11.qpkg dist/SHA256SUMS \
            --target "$GITHUB_SHA" --latest \
            --title 'QnapNarou v0.1.11 — upstream narou.rs v0.5.3' \
            --notes-file dist/RELEASE_NOTES.md
