name: QnapNarou v0.1.14 — fix pest preprocess stack for Pixiv and Alphapolis
on:
  push:
    branches: [main]
    paths: [.github/workflows/qnapnarou-release-v0114.yml]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qnapnarou-release-v0114.yml
      - tools/build_epub_lite.py
      - tools/patch_preprocess_parser.py
      - tests/test_preprocess_parser_patch.py
      - tests/test_build_epub_lite.py
      - tests/test_update_upstream.py
      - tools/update_upstream.py
      - upstream/narou.rs
      - qdk/qpkg.cfg
      - tools/io_probe.py
      - tools/build_qdk.py
      - tests/test_io_probe.py
      - tests/test_build_qdk.py
      - docs/low-write.md

permissions:
  contents: read

concurrency:
  group: qnapnarou-release-v0114
  cancel-in-progress: false

jobs:
  pr-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Python, iOS DOM and service regression tests
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s tests -v
          node tests/test_qnap_epub_browser.cjs
          sh -n qdk/shared/QnapNarou.sh
          sh -n qdk/shared/ensure_ws.sh
          test -s tools/io_probe.py
          grep -q '"configure_hosts.py", "io_probe.py"' tools/build_qdk.py
          ! grep -q 'NAROU_RS_QNAP_MEMORY_CACHE' qdk/shared/QnapNarou.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch reviewed native parser and test both bundled DSL definitions
        run: |
          set -euo pipefail
          python3 tools/patch_preprocess_parser.py --source upstream/narou.rs
          (cd upstream/narou.rs && cargo test --locked --features lite --lib qnap_preprocess_stack_tests -- --nocapture) 2>&1 | tee /tmp/qnap-parser-regression.log
          grep -F -q 'test result: ok. 2 passed' /tmp/qnap-parser-regression.log
  native-qpkg-and-publish:
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source/tag/version and refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: souten-yd/QnapNarou
        run: |
          set -eu
          test "$(git rev-parse HEAD:upstream/narou.rs)" = "47bee6ba703441d3aa989e29694e3df485c4c643"
          test "$(git -C upstream/narou.rs rev-parse HEAD)" = "47bee6ba703441d3aa989e29694e3df485c4c643"
          test "$(git -C upstream/narou.rs rev-parse 'refs/tags/v0.5.5^{commit}')" = "47bee6ba703441d3aa989e29694e3df485c4c643"
          grep -qx 'QPKG_VER="0.1.14"' qdk/qpkg.cfg
          grep -qx 'QPKG_LICENSE="GPL-3.0-only"' qdk/qpkg.cfg
          if gh release view v0.1.14 >/dev/null 2>&1; then
            echo 'v0.1.14 already published; refusing overwrite' >&2
            exit 1
          fi
      - name: Python, iPhone JavaScript, QNAP service guards
        run: |
          set -eu
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q tools tests
          node --check tools/qnap_epub_download.js
          test -s tools/patch_preprocess_parser.py
          node tests/test_qnap_epub_browser.cjs
          sh -n qdk/shared/QnapNarou.sh
          sh -n qdk/shared/ensure_ws.sh
          grep -q 'NAROU_RS_DISABLE_SELF_UPDATE=1' qdk/shared/QnapNarou.sh
          grep -q 'PYTHONDONTWRITEBYTECODE=1' qdk/shared/QnapNarou.sh
          test -s tools/io_probe.py
          grep -q 'DISKSTATS = Path("/proc/diskstats")' tools/io_probe.py
          ! grep -q 'NAROU_RS_QNAP_MEMORY_CACHE' qdk/shared/QnapNarou.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/narou.rs
      - name: Install Rust and QDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools pkg-config build-essential cmake perl
      - name: Build complete upstream native runtime and helpers
        working-directory: upstream/narou.rs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo local-build --locked --target x86_64-unknown-linux-musl
      - name: Apply reviewed GPL EPUB/iPhone and Home Screen source overlays
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -eu
          python3 tools/build_epub_lite.py --source upstream/narou.rs --runtime upstream/narou.rs/narou --target x86_64-unknown-linux-musl
          grep -F -q 'QnapNarou EPUB save/share overlay.' upstream/narou.rs/src/web/assets/js/ui/render.js
          grep -F -q 'data-qnap-epub="1"' upstream/narou.rs/src/web/assets/js/ui/render.js
          grep -F -q 'apple-touch-icon' upstream/narou.rs/src/web/assets/index.html
          grep -a -F -q 'QnapNarou EPUB save/share overlay.' upstream/narou.rs/narou/narou_rs
          grep -a -F -q 'qnapnarou-icon.png' upstream/narou.rs/narou/narou_rs
          grep -F -q 'QNAP_PREPROCESS_STACK_FIX' upstream/narou.rs/src/downloader/preprocess/parser.rs
          grep -a -F -q 'narou-preprocess-parse' upstream/narou.rs/narou/narou_rs
          test -s upstream/narou.rs/narou/AozoraEpub3-Lite-License.md
          if readelf -l upstream/narou.rs/narou/narou_rs | grep -q INTERP; then
            echo 'QNAP runtime must be statically linked' >&2
            exit 1
          fi
      - name: Native EPUB regression test
        working-directory: upstream/narou.rs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-unknown-linux-musl --features lite --lib epub_lite::tests::builds_streamable_epub_from_a_text_file -- --exact
          cargo test --locked --target x86_64-unknown-linux-musl --features lite --lib qnap_preprocess_stack_tests -- --nocapture 2>&1 | tee /tmp/qnap-parser-regression.log
          grep -F -q 'test result: ok. 2 passed' /tmp/qnap-parser-regression.log
      - name: Inspect and package complete QDK runtime
        run: |
          set -eu
          python3 tools/stage_release.py --source upstream/narou.rs/narou --dest build/runtime
          python3 tools/build_qdk.py --runtime build/runtime --out build/qdk
          grep -qx 'QPKG_VER="0.1.14"' build/qdk/qpkg.cfg
          test -x build/qdk/x86_64/runtime/narou_rs
          test -s build/qdk/x86_64/runtime/Third-Party-License.md
          test -s build/qdk/x86_64/runtime/AozoraEpub3-Lite-License.md
          test -s build/qdk/shared/installer.py
          test -s build/qdk/shared/io_probe.py
          cmp tools/io_probe.py build/qdk/shared/io_probe.py
          grep -q 'io_probe.py' tools/build_qdk.py
          curl -fL --retry 3 -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          (cd build/qdk && qbuild)
          mkdir -p dist
          test "$(find build/qdk -name '*.qpkg' -type f | wc -l)" -eq 1
          find build/qdk -name '*.qpkg' -type f -exec cp '{}' dist/QnapNarou_x86_64_0.1.14.qpkg \;
          test -s dist/QnapNarou_x86_64_0.1.14.qpkg
          sha256sum dist/QnapNarou_x86_64_0.1.14.qpkg | tee dist/SHA256SUMS
          sha256sum -c dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: QnapNarou-x86_64-0.1.14-reviewed-v0.5.5
          path: |
            dist/QnapNarou_x86_64_0.1.14.qpkg
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Publish exact tested QPKG (no replacement)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: souten-yd/QnapNarou
        run: |
          set -eu
          sha256sum -c dist/SHA256SUMS
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          # QnapNarou v0.1.14 — preprocess parser stack regression fix

          - Native x86_64 GPL lite runtime from upstream v0.5.5 commit 47bee6ba703441d3aa989e29694e3df485c4c643, with reviewed QNAP iPhone EPUB modal, Home Screen icons, QTS manager and boot retry.
          - Includes QTS read-only disk I/O diagnosis tool io_probe.py under the package's shared files. Run manually with --seconds 120 --disks sda sdb. It samples system-wide diskstats, not per-process writes.
          - Fixes pest 'stack limit reached' when compiling bundled Pixiv/Alphapolis preprocess DSL: uses bounded 16 MiB parser thread stack with a 256 KiB source-size limit, retaining pest overflow checks. Native Rust regression runs both complete bundled definitions from a 2 MiB caller thread.
          - Same pinned upstream v0.5.5 as v0.1.13; ports, paths, Web UI, novel database, EPUB/iOS, managers, upstream grammar and site definitions remain unchanged. No experimental M4 SQLite cache or unattended NAS update.
          - Preserves the read-only I/O probe restored in v0.1.12. Upstream has revised preset defaults and credential safeguards; actual NAS migrations remain to be validated.
          - SHA256SUMS contains the final QPKG checksum. Exact source is this tag's QNAP code + public pinned upstream gitlink.
          - All CI tests, native Rust compile and QDK packaging must pass before this release is created.
          - Real QTS install/upgrade, post-upgrade Web UI, rollback and idle IOPS have not yet been verified for v0.1.14. Back up QnapNarou-data before upgrading. Keep ports 8888/8889 on LAN/Tailscale only.
          NOTES
          gh release create v0.1.14 dist/QnapNarou_x86_64_0.1.14.qpkg dist/SHA256SUMS \
            --target "$GITHUB_SHA" --latest \
            --title 'QnapNarou v0.1.14 — preprocess parser stack fix' \
            --notes-file dist/RELEASE_NOTES.md
          gh release view v0.1.14 --json assets --jq '.assets[].name' | grep -Fx 'QnapNarou_x86_64_0.1.14.qpkg'
          gh release view v0.1.14 --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS'
