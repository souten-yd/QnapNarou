name: QnapNarou v0.1.8 icon-only QPKG
on:
  push:
    branches: [feat/app-icons-v018]
    paths: [.github/workflows/app-icons-v018.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qpkg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Run all unit tests and QTS shell guards
        run: |
          python3 -m pip install --quiet pillow
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -v
          sh -n qdk/shared/QnapNarou.sh
          sh -n qdk/shared/ensure_ws.sh
          grep -q 'QPKG_VER="0.1.8"' qdk/qpkg.cfg
          grep -q 'GPL-3.0-only' qdk/qpkg.cfg
          grep -q 'corrected_download_ui' tools/build_epub_lite.py
          grep -q 'same-origin confirmation required' tools/manager.py
          grep -q 'wait_for_running' tools/installer.py
      - name: Install QDK (no Rust build)
        run: |
          curl -fL --retry 3 -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
      - name: Obtain the verified v0.1.7 EPUB/iPhone/Web updater runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: souten-yd/QnapNarou
        run: |
          set -eu
          mkdir -p build/old build/extracted build/payload
          gh release download v0.1.7 --pattern 'QnapNarou_x86_64_0.1.7.qpkg' --dir build/old
          echo '650816710655dbfc1ff4bfb410fdc6ef422ec5513a615b30463ab1190b8ee787  build/old/QnapNarou_x86_64_0.1.7.qpkg' | sha256sum -c -
          qbuild --extract build/old/QnapNarou_x86_64_0.1.7.qpkg build/extracted
          find build/extracted -maxdepth 2 -type f -printf '%p %s bytes\n'
          data=$(find build/extracted -maxdepth 1 -type f -name 'data.tar.gz' | head -n 1)
          test -n "$data"
          # QDK pads its embedded gzip archive with non-gzip trailing bytes.
          # Decompress exactly the first verified gzip stream (no integrity bypass).
          DATA_ARCHIVE="$data" python3 - <<'PY'
          import os, zlib
          from pathlib import Path
          encoded = Path(os.environ["DATA_ARCHIVE"]).read_bytes()
          decoder = zlib.decompressobj(zlib.MAX_WBITS | 16)
          decoded = decoder.decompress(encoded) + decoder.flush()
          print("QDK payload bytes:", len(encoded), "uncompressed:", len(decoded),
                "gzip_eof:", decoder.eof)
          if not decoder.eof or len(decoded) > 3 * 1024 * 1024 * 1024:
              raise ValueError("QDK payload truncated or unreasonably large")
          Path("build/extracted/data-clean.tar").write_bytes(decoded)
          PY
          tar -xf build/extracted/data-clean.tar -C build/payload
          count=$(find build/payload -type f -name narou_rs | wc -l)
          test "$count" -eq 1
          binary=$(find build/payload -type f -name narou_rs | head -n 1)
          dirname "$binary" > build/runtime-dir
          runtime=$(cat build/runtime-dir)
          test -s "$runtime/AozoraEpub3-Lite-License.md"
          test -s "$runtime/Third-Party-License.md"
          test -d "$runtime/webnovel"
          test -d "$runtime/preset"
          sha256sum "$binary" | cut -d' ' -f1 >build/old-rust-sha
      - name: Repackage approved icons without recompiling Rust
        run: |
          runtime=$(cat build/runtime-dir)
          python3 tools/build_qdk.py --runtime "$runtime" --out build/qdk
          test -s build/qdk/shared/manager.py
          test -s build/qdk/shared/apple-touch-icon.png
          test -s build/qdk/shared/icon-192.png
          test -s build/qdk/icons/QnapNarou.gif
          test -s build/qdk/icons/QnapNarou_gray.gif
          test -s build/qdk/icons/QnapNarou_80.gif
          grep -q 'rel="apple-touch-icon"' build/qdk/shared/manager.py
          test -s build/qdk/shared/installer.py
          grep -q 'same-origin confirmation required' build/qdk/shared/manager.py
          grep -q 'wait_for_running' build/qdk/shared/installer.py
          test "$(sha256sum build/qdk/x86_64/runtime/narou_rs | cut -d' ' -f1)" = "$(cat build/old-rust-sha)"
          (cd build/qdk && qbuild)
          mkdir -p dist
          test "$(find build/qdk -type f -name '*.qpkg' | wc -l)" -eq 1
          find build/qdk -type f -name '*.qpkg' -exec cp '{}' dist/QnapNarou_x86_64_0.1.8.qpkg \;
          test -s dist/QnapNarou_x86_64_0.1.8.qpkg
          sha256sum dist/QnapNarou_x86_64_0.1.8.qpkg
      - uses: actions/upload-artifact@v4
        with:
          name: QnapNarou-x86_64-0.1.8-AppIcons
          path: dist/QnapNarou_x86_64_0.1.8.qpkg
          retention-days: 14
          if-no-files-found: error
