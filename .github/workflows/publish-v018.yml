name: Publish QnapNarou v0.1.8 icon QPKG
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v018.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify merged QNAP overlay source and lightweight regression tests
        run: |
          python3 -m pip install --quiet pillow
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -q
          node --check tools/qnap_epub_download.js
          node tests/test_qnap_epub_browser.cjs
          grep -q 'QPKG_VER="0.1.8"' qdk/qpkg.cfg
          grep -q 'OVERLAY_MARKER' tools/build_epub_lite.py
          test -s assets/qnapnarou-approved.jpg
          test -f tools/build_icons.py
          grep -q 'wait_for_running' tools/installer.py
          test -f .gitmodules
      - name: Fetch previously compiled QPKG; SHA-256 must match
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: souten-yd/QnapNarou
        run: |
          mkdir -p dist
          gh run download 38110673179 --name QnapNarou-x86_64-0.1.8-AppIcons --dir dist
          test -s dist/QnapNarou_x86_64_0.1.8.qpkg
          echo 'f3adad700496bc65875a60dfe25a9d62c871d30bd242f46a8b71ef2b13cbbe8c  dist/QnapNarou_x86_64_0.1.8.qpkg' | sha256sum -c -
      - name: Publish normal GitHub release; no Rust recompile
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: souten-yd/QnapNarou
        run: |
          if gh release view v0.1.8 >/dev/null 2>&1; then
            echo 'v0.1.8 already exists; refusing overwrite' >&2
            exit 1
          fi
          cat >/tmp/v017-release.md <<'RELEASE_NOTES'
          # QnapNarou v0.1.8 — QTS and iPhone portal icons

          Includes approved book/NAS artwork as App Center icons, plus
          apple-touch-icon, favicon, PWA manifest and iOS safe-area handling
          for the QNAP management portal on port 8889.
          QDK required images: 64x64 active/gray and 80x80 detail GIF.
          No runtime icon conversion or recurring disk writes.
          The original Narou Web UI at port 8888 has NOT been modified for
          its own Home Screen icon; add the 8889 management portal to the
          Home Screen to use this icon.
          All original EPUB, iPhone download modal, novel data and verified
          tokenless QTS Web update logic are retained.

          Install via QNAP manager 8889 -> 最新版を確認 -> 最新版へ更新.
          Existing iOS Home Screen shortcuts may need removal and re-addition
          to refresh the icon.

          SHA-256: f3adad700496bc65875a60dfe25a9d62c871d30bd242f46a8b71ef2b13cbbe8c
          Source: https://github.com/souten-yd/QnapNarou/tree/main
          RELEASE_NOTES
          gh release create v0.1.8 dist/QnapNarou_x86_64_0.1.8.qpkg \
            --target "$GITHUB_SHA" --latest \
            --title 'QnapNarou v0.1.8 — iPhone EPUB Save Dialog' \
            --notes-file /tmp/v017-release.md
