name: QNAP QPKG preflight (one-shot)
on:
  workflow_dispatch:
  push:
    branches: [release/qpkg-preflight]
    paths: [.github/workflows/qdk-preflight.yml]

permissions:
  contents: read

jobs:
  qpkg-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/narou.rs
      - name: Install static build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools pkg-config build-essential cmake perl
      - name: Build complete upstream runtime
        working-directory: upstream/narou.rs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo local-build --locked --target x86_64-unknown-linux-musl
          file narou/narou_rs
          if readelf -l narou/narou_rs | grep -q 'INTERP'; then
            echo 'Binary requires a dynamic loader: not safe for QTS distribution' >&2
            exit 1
          fi
      - name: Minimal tests and complete staging
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/stage_release.py --source upstream/narou.rs/narou --dest build/runtime
          python3 tools/build_qdk.py --runtime build/runtime --out build/qdk
          test -x build/qdk/x86_64/runtime/narou_rs
          test -s build/qdk/shared/manager.py
          sh -n build/qdk/shared/QnapNarou.sh
      - name: Install QDK 2.5.3 and generate QPKG
        run: |
          curl -fL --retry 3 -o /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y /tmp/qdk.deb
          cd build/qdk
          qbuild
      - name: Export single QPKG artifact
        run: |
          mkdir -p dist
          find build/qdk -type f -name '*.qpkg' -print
          find build/qdk -type f -name '*.qpkg' -print0 | xargs -0 -r -I '{}' cp '{}' dist/QnapNarou_x86_64_0.1.0.qpkg
          test -s dist/QnapNarou_x86_64_0.1.0.qpkg
          sha256sum dist/QnapNarou_x86_64_0.1.0.qpkg
      - uses: actions/upload-artifact@v4
        with:
          name: QnapNarou-x86_64-QPKG-unverified
          path: dist/QnapNarou_x86_64_0.1.0.qpkg
          retention-days: 7
          if-no-files-found: error
